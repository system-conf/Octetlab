<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- English defaults for crawlers; the app replaces title, description, og:title, og:description, og:locale(:alternate) and <html lang> with the active language. -->
    <title>Octetlab — a network lab in your browser</title>
    <meta
      name="description"
      content="A free, open-source network lab in your browser. Build and cable networks, configure them from a GUI or an IOS-style CLI, watch every packet in simulation mode, and learn with sample labs, troubleshooting exercises and design tasks."
    />
    <meta name="theme-color" content="#0369a1" />
    <!-- Icons: public/favicon.svg is the source; `npm run pwa:icons` generates the PNGs and favicon.ico (docs/PWA.md).
         <link rel="manifest"> is added by vite-plugin-pwa at build time (vite.config.ts). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Octetlab" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />
    <meta property="og:site_name" content="Octetlab" />
    <meta property="og:title" content="Octetlab — a network lab in your browser" />
    <meta
      property="og:description"
      content="Build, configure and simulate networks packet by packet. In your browser, free and open source. English and Turkish."
    />
    <meta property="og:url" content="https://octetlab.slovveis.workers.dev/" />
    <!-- Share image: source docs/images/ogImage.svg, rendered to public/ogImage.png by `npm run og:image`. -->
    <meta property="og:image" content="https://octetlab.slovveis.workers.dev/ogImage.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Octetlab — a network lab in your browser. A router, a switch and three PCs cabled together with green link lights."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://octetlab.slovveis.workers.dev/ogImage.png" />
    <meta
      name="twitter:image:alt"
      content="Octetlab — a network lab in your browser. A router, a switch and three PCs cabled together with green link lights."
    />
    <meta name="twitter:title" content="Octetlab" />
    <meta
      name="twitter:description"
      content="Build, configure and simulate networks packet by packet. In your browser, free and open source. English and Turkish."
    />
    <link rel="canonical" href="https://octetlab.slovveis.workers.dev/" />
    <!-- Appearance preferences before the first paint (no light flash in dark mode). Mirrors
         src/preferences/ThemeApplier.ts (ThemeApplier.test.ts compares both); the app re-applies them. -->
    <script id="preferencesBoot">
      (function (root) {
        try {
          var stored = JSON.parse(localStorage.getItem('agArizaLab.preferences') || '{}')
          var look = (stored && typeof stored.appearance === 'object' && stored.appearance) || {}
          var dark = look.theme === 'dark' ||
            (look.theme === 'system' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', dark)
          root.setAttribute('data-density', look.density === 'compact' ? 'compact' : 'comfortable')
          if (look.highContrast === true) root.setAttribute('data-contrast', 'more')
          else root.removeAttribute('data-contrast')
          var scales = [0.875, 1.125, 1.25, 1.5]
          root.style.fontSize = scales.indexOf(look.fontScale) >= 0 ? look.fontScale * 100 + '%' : ''
        } catch (error) {
          console.warn('Saved appearance could not be applied early; the app applies it after loading.', error)
        }
      })(document.documentElement)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
